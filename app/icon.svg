<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Inspectra AI">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233C"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="reticle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DE8FF"/>
      <stop offset="1" stop-color="#00A8CC"/>
    </linearGradient>
    <radialGradient id="mark" cx="0.38" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#FF8A96"/>
      <stop offset="1" stop-color="#E6203A"/>
    </radialGradient>
  </defs>

  <!-- Rounded plate: reads as an app tile at any size, and keeps the mark
       legible on both the dark and the light browser tab strips. -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#plate)"/>
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="14.25" fill="none"
        stroke="#00D9FF" stroke-opacity="0.34" stroke-width="1.5"/>

  <!-- Reticle corner brackets. Drawn thick and short on purpose: a favicon is
       rendered at 16px in a tab, where thin long arms smear into noise. -->
  <g fill="none" stroke="url(#reticle)" stroke-width="4.6" stroke-linecap="round">
    <path d="M14 23.5V17a3 3 0 0 1 3-3h6.5"/>
    <path d="M40.5 14H47a3 3 0 0 1 3 3v6.5"/>
    <path d="M50 40.5V47a3 3 0 0 1-3 3h-6.5"/>
    <path d="M23.5 50H17a3 3 0 0 1-3-3v-6.5"/>
  </g>

  <!-- The finding: a measured defect inside the frame, not decoration. -->
  <circle cx="32" cy="32" r="13.5" fill="none" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="32" cy="32" r="8" fill="url(#mark)"/>
  <circle cx="28.9" cy="28.9" r="2.1" fill="#FFFFFF" fill-opacity="0.72"/>
</svg>
