[alembic]
script_location = backend/alembic
sqlalchemy.url = postgresql+psycopg2://inspectra:inspectra@localhost:5432/inspectra
prepend_sys_path = .
version_path_separator = os
truncate_salt = 4

[alembic:runtime]
use_schemadissector = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
